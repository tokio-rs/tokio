# https://embarkstudios.github.io/cargo-deny/cli/init.html

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
]
exceptions = [
    { allow = ["Unicode-3.0"], crate = "unicode-ident" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# TEMPORARY: mio's wasm32-unknown-emscripten target (tokio-rs/mio#1969), and
# its libc epoll bindings for emscripten (rust-lang/libc#5427, unreleased).
allow-git = ["https://github.com/guybedford/mio", "https://github.com/rust-lang/libc"]
