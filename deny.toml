# https://embarkstudios.github.io/cargo-deny/cli/init.html

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
]
exceptions = [
    { allow = ["Unicode-3.0"], crate = "unicode-ident" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# TEMPORARY: `AsRawHandle` for mio's `Registry` on Windows (tokio-rs/mio#2023),
# until it is released.
allow-git = ["https://github.com/guybedford/mio"]
